# Esimerkkien tarkistusasetukset (ruff ja mypy --strict).
[project]
name = "fysikaalinen-mallinnus-esimerkit"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0", "scipy==1.18.1", "sympy==1.14.0", "scikit-fem==12.0.2",
  "matplotlib>=3.8",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "SIM", "NPY"]

[tool.mypy]
python_version = "3.12"
strict = true
# Oma pieni elementtikirjasto (luku 7), jota myöhemmät esimerkit käyttävät.
mypy_path = "esimerkit/07-pienfem"

# SymPyllä ja scikit-femillä ei ole tyyppitietoja.
[[tool.mypy.overrides]]
module = ["sympy", "sympy.*", "skfem", "skfem.*"]
ignore_missing_imports = true
