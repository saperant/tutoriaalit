# Esimerkkien tarkistusasetukset. Säännöt S (flake8-bandit) ovat
# luvun Analyysi CI:ssä aiheena: sama tarkistus kuin tiimin CI:ssä.
[project]
name = "turvallinen-kehitys-esimerkit"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "SIM", "S"]

[tool.mypy]
python_version = "3.12"
strict = true
