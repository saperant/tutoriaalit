name: Kommenttibotti
on:
  pull_request_target:
  issue_comment:
    types: [created]

jobs:
  vastaa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: tj-actions/changed-files@v46
      - name: Tervehdi
        run: |
          echo "Kiitos: ${{ github.event.comment.body }}"
          make testaa
