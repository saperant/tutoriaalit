# Esimerkkien tarkistusasetukset (ruff, mypy --strict ja pytest).
[project]
name = "jatkuva-toimitus-esimerkit"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = []

[tool.ruff]
target-version = "py312"
line-length = 78

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
