# Python-esimerkkien tarkistusasetukset.
[project]
name = "digitaalitekniikka-esimerkit"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Pyflakes ja pycodestyle (oletus) sekä bugbear, pyupgrade ja simplify.
select = ["E", "F", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
