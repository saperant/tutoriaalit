# Pandoc-asetukset kielipakettien pikaoppaille: vaakasuuntainen,
# kaksipalstainen A4. Käyttö:
#   pandoc --defaults=../yhteiset/pikaopas.yaml pikaopas.md -o x.pdf
from: markdown
pdf-engine: xelatex
filters:
  - ${.}/sisallyta.lua
include-in-header:
  - ${.}/tyyli.tex
  - ${.}/pikaopas.tex
number-sections: false
highlight-style: ${.}/korostus.theme
variables:
  documentclass: scrartcl
  classoption:
    - a4paper
    - landscape
    - twocolumn
    - fontsize=9pt
    - parskip=half
  lang: fi
  geometry:
    - landscape
    - margin=11mm
    - columnsep=9mm
  mainfont: Inter
  mainfontoptions:
    - Numbers=Lining
  sansfont: Inter Display
  monofont: JetBrains Mono
  monofontoptions:
    - Scale=0.84
  colorlinks: true
  linkcolor: korostus-tumma
  urlcolor: korostus-tumma
