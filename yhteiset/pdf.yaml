# Yhteiset pandoc-asetukset kaikille tutoriaaleille.
# Käyttö: pandoc --defaults=../yhteiset/pdf.yaml metadata.yaml luvut/*.md
from: markdown
pdf-engine: xelatex
filters:
  - ${.}/sisallyta.lua
  - ${.}/ulkoasu.lua
include-in-header:
  - ${.}/tyyli.tex
top-level-division: chapter
number-sections: true
table-of-contents: true
toc-depth: 2
highlight-style: ${.}/korostus.theme
variables:
  documentclass: scrreprt
  classoption:
    - a4paper
    - fontsize=10pt
    - oneside
    - parskip=half
  lang: fi
  geometry:
    - top=24mm
    - bottom=26mm
    - left=26mm
    - right=26mm
    - headsep=8mm
  mainfont: Inter
  mainfontoptions:
    - Numbers=Lining
  sansfont: Inter Display
  monofont: JetBrains Mono
  monofontoptions:
    - Contextuals=NoAlternate
    - Scale=0.84
  colorlinks: true
  linkcolor: korostus-tumma
  urlcolor: korostus-tumma
  filecolor: korostus-tumma
  citecolor: korostus-tumma
  toccolor: muste
