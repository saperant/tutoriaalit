# Esimerkkien tarkistusasetukset (ruff ja mypy --strict).
[project]
name = "projektinhallinta-esimerkit"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = []

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
