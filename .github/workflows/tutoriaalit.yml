name: Tutoriaalit

# Kehitys on trunk-pohjaista: muutokset tehdään suoraan main-haaraan.
on:
  push:
    branches: [main]
  pull_request:
  # Viikoittain ja käsin käynnistettäessä testataan kaikki, jotta
  # ympäristön muutokset (pakettipäivitykset) huomataan.
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Saman haaran ajot suoritetaan peräkkäin: käynnissä oleva ajo valmistuu,
# ja odottamaan jää vain uusin ajo. Näin tiheät pushit eivät peruuta
# jokaista ajoa, eikä vanhempi ajo voi julkaista sivustoa uudemman päälle.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Testataan vain paketit, jotka ovat muuttuneet viimeisimmän onnistuneen
  # ajon jälkeen (ks. yhteiset/ci.py). Yhteisten tiedostojen muutos,
  # viikkoajo ja käsin käynnistys testaavat kaikki.
  muutokset:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      paketit: ${{ steps.muutokset.outputs.paketit }}
      kontit: ${{ steps.muutokset.outputs.kontit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: muutokset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          perusta=""
          if [ "${{ github.event_name }}" = push ]; then
            perusta=$(gh run list -R "${{ github.repository }}" \
                --workflow tutoriaalit.yml --branch main --status success \
                --limit 1 --json headSha -q '.[0].headSha' || true)
          fi
          echo "Perusta: ${perusta:-ei (testataan kaikki)}"
          python3 yhteiset/ci.py muuttuneet ${perusta:+--perusta "$perusta"} \
            | tee -a "$GITHUB_OUTPUT"

  testaa-ja-rakenna:
    needs: muutokset
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Asenna työkalut
        run: |
          # man-db:n hakemiston päivitys hidastaa asennusta minuutteja.
          sudo rm -f /var/lib/man-db/auto-update
          # Asennettavat palvelut (snmpd, freeradius ym.) eivät saa
          # käynnistyä ajokoneella; esimerkit käynnistävät ne itse.
          printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d > /dev/null
          sudo chmod +x /usr/sbin/policy-rc.d
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends \
            make python3 pandoc g++-14 clang-20 libclang-rt-20-dev \
            texlive-xetex texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-lang-european lmodern \
            fonts-dejavu fonts-inter fonts-jetbrains-mono graphviz \
            shellcheck bats openssh-client verilator sqlite3 tcl8.6 ghdl racket \
            tcpdump dnsmasq-base bind9-dnsutils nftables bird2 \
            wireguard-tools wireguard-go busybox socat snmp snmpd \
            softflowd nfdump freeradius freeradius-utils qemu-system-x86 \
            qemu-utils slapd ldap-utils restic rsync e2fsprogs libsdl2-dev nlohmann-json3-dev gnuradio \
            libegl-dev libopengl-dev libgl1-mesa-dri libegl-mesa0 \
            mesa-vulkan-drivers libvulkan-dev vulkan-validationlayers glslc \
            gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm \
            gcc-riscv64-unknown-elf yosys iverilog gcc-riscv64-linux-gnu \
            libc6-dev-riscv64-cross qemu-user nextpnr-ice40 fpga-icestorm \
            cmake ninja-build gcovr clang-tidy-20 cppcheck gdb pkgconf python3-dev \
            rustc-1.80 cargo-1.80 rust-1.80-clippy golang-1.23-go \
            openjdk-21-jdk-headless z3 libsystemc-dev gdb-multiarch strace valgrind \
            radare2 ltrace linux-source-6.8.0 gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross u-boot-qemu u-boot-tools device-tree-compiler \
            flex bison bc libssl-dev libelf-dev cpio kmod bzip2 haproxy redis-server \
            postgresql-16 lld-20 afl++ libxml2-utils libopencv-dev \
            maxima maxima-share ngspice mariadb-server mariadb-client octave \
            doxygen
          pip install --break-system-packages ruff mypy pytest \
            numpy scipy==1.18.1 scipy-stubs==1.18.1.1 matplotlib cryptography==50.0.1 types-PyYAML hadolint-bin==2.15.1 \
            kubernetes-validate==1.37.0 yamllint==1.38.0 check-jsonschema==0.39.0 \
            ansible-core==2.21.6 pybind11==3.1.0 nanobind==3.1.0 \
            cocotb==2.1.0 "setuptools>=77" "packaging>=24.2" wheel \
            psycopg==3.3.9 psycopg-binary==3.3.9 \
            systemrdl-compiler==1.33.0 peakrdl==1.5.0 peakrdl-regblock==1.3.1 \
            peakrdl-cheader==1.2.0 peakrdl-uvm==2.4.0 peakrdl-ipxact==3.5.0 \
            unicorn==2.1.4 capstone==5.0.9 opencv-python-headless==5.1.0.95 \
            sympy==1.14.0 scikit-fem==12.0.2 sqlalchemy==2.1.9 pymysql==1.2.4 \
            testcontainers==4.15.0 redis==8.2.0 pymongo==4.20.1 \
            cassandra-driver==3.30.1 neo4j==6.4.1 \
            pyopenssl==26.4.0 service-identity==26.1.0 \
            sphinx==8.2.3 mkdocs==1.6.1 openapi-spec-validator==0.9.0 \
            pytest-bdd==9.0.1 hypothesis==6.170.17 coverage==7.17.5

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3

      # Ajokoneen oletus-JDK on vanhempi; esimerkit vaativat Java 21:n.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Asenna TypeScript, html-validate ja Kotlin
        run: |
          npm install -g typescript@7.0.2 @types/node@24 html-validate@11.21.1
          curl -fsSL -o /tmp/kotlin.zip \
            https://github.com/JetBrains/kotlin/releases/download/v2.4.21/kotlin-compiler-2.4.21.zip
          sudo unzip -q /tmp/kotlin.zip -d /opt
          echo /opt/kotlinc/bin >> "$GITHUB_PATH"

      - name: Asenna Playwright sivuston ja HTML-esimerkkien testeihin
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      # Projektiesimerkkien (npm, Maven, Gradle) ladatut riippuvuudet.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.m2/repository
            ~/.m2/wrapper
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: riippuvuudet-${{ hashFiles('**/package-lock.json', '**/pom.xml', '**/*.gradle.kts', '**/gradle-wrapper.properties', '**/maven-wrapper.properties') }}
          restore-keys: riippuvuudet-

      # Android-esimerkkien SDK-paketit; ajokoneen SDK:sta ne voivat puuttua.
      - name: Asenna Android SDK -paketit
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.2" "build-tools;36.0.0" > /dev/null

      # PDF:t rakennetaan ensin, koska sivuston testi tarkistaa, että
      # jokaisen valmiin tutoriaalin PDF on mukana. Muuttumattomien
      # pakettien PDF:t palautetaan välimuistista (ks. yhteiset/ci.py).
      - name: Palauta PDF-välimuisti
        uses: actions/cache/restore@v4
        with:
          path: .pdf-valimuisti
          key: pdf-${{ github.sha }}
          restore-keys: pdf-

      - name: Rakenna PDF:t
        run: |
          python3 yhteiset/ci.py pdf-palauta .pdf-valimuisti
          make -k -j4 pdf

      - name: Tallenna PDF-välimuisti
        if: always()
        run: python3 yhteiset/ci.py pdf-tallenna .pdf-valimuisti

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .pdf-valimuisti
          key: pdf-${{ github.sha }}

      - name: Testaa esimerkit, taitopuu ja sivusto
        run: |
          if [ "${{ needs.muutokset.outputs.paketit }}" = kaikki ]; then
            make testaa
          else
            make testaa TESTATTAVAT="${{ needs.muutokset.outputs.paketit }}"
          fi

      - name: Rakenna sivusto
        run: make -C sivusto

      - name: Tallenna PDF:t
        uses: actions/upload-artifact@v4
        with:
          name: tutoriaalit-pdf
          path: "*/*.pdf"

      - name: Tallenna sivusto GitHub Pagesia varten
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: sivusto/rakennus

  julkaise:
    needs: testaa-ja-rakenna
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.julkaisu.outputs.page_url }}
    steps:
      - id: julkaisu
        uses: actions/deploy-pages@v4

  kehityskontti:
    needs: muutokset
    if: needs.muutokset.outputs.kontit != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tutoriaali: ${{ fromJSON(needs.muutokset.outputs.kontit) }}
    steps:
      - uses: actions/checkout@v4

      # Kuvien kerrokset GitHub Actionsin välimuistiin (ks.
      # yhteiset/testaa_kontti.py): buildx ja välimuistin tunnisteet.
      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3

      - name: Testaa tutoriaali omassa kehityskontissaan
        env:
          KONTTI_VALIMUISTI: gha
        run: python3 yhteiset/testaa_kontti.py ${{ matrix.tutoriaali }}
