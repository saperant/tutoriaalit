name: Tutoriaalit

# Kehitys on trunk-pohjaista: muutokset tehdään suoraan main-haaraan.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Uusi ajo peruu saman haaran keskeneräisen ajon, jotta vanhentunut ajo
# ei voi julkaista sivustoa uudemman päälle.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testaa-ja-rakenna:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Asenna työkalut
        run: |
          # man-db:n hakemiston päivitys hidastaa asennusta minuutteja.
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make python3 pandoc g++-14 clang-20 libclang-rt-20-dev \
            texlive-xetex texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-lang-european lmodern \
            fonts-dejavu fonts-inter fonts-jetbrains-mono graphviz \
            shellcheck bats openssh-client verilator sqlite3 tcl8.6 ghdl racket \
            rustc-1.80 cargo-1.80 rust-1.80-clippy golang-1.23-go \
            openjdk-21-jdk-headless
          pip install --break-system-packages ruff mypy pytest \
            numpy cryptography==50.0.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3

      # Ajokoneen oletus-JDK on vanhempi; esimerkit vaativat Java 21:n.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Asenna TypeScript, html-validate ja Kotlin
        run: |
          npm install -g typescript@7.0.2 @types/node@24 html-validate@11.21.1
          curl -fsSL -o /tmp/kotlin.zip \
            https://github.com/JetBrains/kotlin/releases/download/v2.4.21/kotlin-compiler-2.4.21.zip
          sudo unzip -q /tmp/kotlin.zip -d /opt
          echo /opt/kotlinc/bin >> "$GITHUB_PATH"

      - name: Asenna Playwright sivuston ja HTML-esimerkkien testeihin
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      # Projektiesimerkkien (npm, Maven, Gradle) ladatut riippuvuudet.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.m2/repository
            ~/.m2/wrapper
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: riippuvuudet-${{ hashFiles('**/package-lock.json', '**/pom.xml', '**/*.gradle.kts', '**/gradle-wrapper.properties', '**/maven-wrapper.properties') }}
          restore-keys: riippuvuudet-

      # Android-esimerkkien SDK-paketit; ajokoneen SDK:sta ne voivat puuttua.
      - name: Asenna Android SDK -paketit
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.2" "build-tools;36.0.0" > /dev/null

      - name: Testaa esimerkit, taitopuu ja sivusto
        run: make testaa

      - name: Rakenna PDF:t ja sivusto
        run: make pdf && make -C sivusto

      - name: Tallenna PDF:t
        uses: actions/upload-artifact@v4
        with:
          name: tutoriaalit-pdf
          path: "*/*.pdf"

      - name: Tallenna sivusto GitHub Pagesia varten
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: sivusto/rakennus

  julkaise:
    needs: testaa-ja-rakenna
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.julkaisu.outputs.page_url }}
    steps:
      - id: julkaisu
        uses: actions/deploy-pages@v4

  kontit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tutoriaalit: ${{ steps.lista.outputs.tutoriaalit }}
    steps:
      - uses: actions/checkout@v4
      - id: lista
        run: |
          echo "tutoriaalit=$(python3 yhteiset/testaa_kontti.py --lista)" \
            >> "$GITHUB_OUTPUT"

  kehityskontti:
    needs: kontit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tutoriaali: ${{ fromJSON(needs.kontit.outputs.tutoriaalit) }}
    steps:
      - uses: actions/checkout@v4

      - name: Testaa tutoriaali omassa kehityskontissaan
        run: python3 yhteiset/testaa_kontti.py ${{ matrix.tutoriaali }}
