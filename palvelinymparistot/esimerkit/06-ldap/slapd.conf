# Opetuskäyttöön: oikeassa palvelussa asetukset ovat cn=config-
# hakemistossa, yhteydet salataan (ldaps:// tai StartTLS) ja
# ylläpitäjän salasana on tiivisteenä.
include   /etc/ldap/schema/core.schema
include   /etc/ldap/schema/cosine.schema
include   /etc/ldap/schema/inetorgperson.schema
include   /etc/ldap/schema/nis.schema
modulepath /usr/lib/ldap
moduleload back_mdb

database  mdb
suffix    "dc=esimerkki,dc=fi"
rootdn    "cn=admin,dc=esimerkki,dc=fi"
rootpw    yllapito-salasana
directory TIETOKANTA

# @alku acl
# Salasanan tiivisteeseen pääsee vain kirjautumisen tarkistus ja
# käyttäjä itse (vaihtaessaan sen). Muuhun dataan saa lukuoikeuden.
access to attrs=userPassword
    by self write
    by anonymous auth
    by * none
access to *
    by self write
    by users read
    by * none
# @loppu acl
