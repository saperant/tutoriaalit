# Esimerkkien tarkistusasetukset (ruff ja mypy --strict).
[project]
name = "elektroniikan-perusteet-esimerkit"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "sympy==1.14.0", "matplotlib>=3.8",
                "schemdraw==0.23"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "SIM", "NPY"]

[tool.mypy]
python_version = "3.12"
strict = true

# SymPyssä ei ole tyyppitietoja (py.typed puuttuu), joten mypy käsittelee
# sen oliot tyyppinä Any. Muu koodi tarkistetaan tiukasti.
[[tool.mypy.overrides]]
module = ["sympy", "sympy.*"]
ignore_missing_imports = true
