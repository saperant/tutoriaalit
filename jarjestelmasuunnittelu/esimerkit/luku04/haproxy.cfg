# HAProxy kolmen taustapalvelimen edessä. Portit ja hallintasoketti
# tulevat ympäristömuuttujista, jotta testit voivat käyttää vapaita
# portteja; tuotannossa ne olisivat kiinteät.

# @alku yleiset
global
    stats socket "${HALLINTA}" mode 600 level admin
    log stderr format short local0 notice

defaults
    mode http
    log global
    timeout connect 1s
    timeout client 10s
    timeout server 5s
    retries 2
    option redispatch 1
# @loppu yleiset

# @alku palvelu
frontend sisaan
    bind 127.0.0.1:"${HAPROXY_PORTTI}"
    default_backend web

backend web
    balance roundrobin
    option httpchk GET /terveys
    http-check expect status 200
    default-server check inter 200ms fall 2 rise 2
    server a 127.0.0.1:"${A_PORTTI}"
    server b 127.0.0.1:"${B_PORTTI}"
    server c 127.0.0.1:"${C_PORTTI}"
# @loppu palvelu
