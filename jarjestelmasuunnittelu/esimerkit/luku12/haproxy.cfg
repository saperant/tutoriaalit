# Lyhytosoitepalvelun kuormantasaaja. Osoitteet tulevat ympäristö-
# muuttujista: testissä 127.0.0.1 ja vapaat portit, Composessa
# palvelujen nimet (ks. compose.yaml).
global
    stats socket "${HALLINTA}" mode 600 level admin

defaults
    mode http
    timeout connect 1s
    timeout client 10s
    timeout server 5s
    retries 2
    option redispatch 1

frontend sisaan
    bind "${SISAAN}"
    default_backend api

backend api
    balance roundrobin
    option httpchk GET /terveys
    http-check expect status 200
    default-server check inter 500ms fall 2 rise 2
    server a "${A_OSOITE}"
    server b "${B_OSOITE}"
