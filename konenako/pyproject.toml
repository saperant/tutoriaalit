# Esimerkkien tarkistusasetukset (ruff ja mypy --strict).
[project]
name = "konenako-esimerkit"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "opencv-python-headless==5.1.0.95"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "SIM", "NPY"]

[tool.mypy]
python_version = "3.12"
strict = true
