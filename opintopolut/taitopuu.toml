# Tutoriaalien taitopuu.
#
# Jokainen [[taito]] on yksi tutoriaali. `edellyttaa` luettelee taidot,
# jotka on hallittava ensin. Luetteloon merkitään vain välittömät
# esitiedot: jos A edellyttää B:tä ja B edellyttää C:tä, A:han ei
# merkitä C:tä (tarkistin hylkää tällaiset tarpeettomat kaaret).
#
# `laajuus` on arvio opintopisteinä (1 op ≈ 27 tuntia työtä).
# `roadmap` viittaa roadmap.sh:n polkuihin, joita on käytetty aihepiirin
# rajauksen tukena. `amk` on tyypillinen vastaava ammattikorkeakoulun
# opintojakso. `testaus` kertoo, miten tutoriaalin koodi testataan.
# `tutoriaali` on valmiin tutoriaalin hakemisto repositoriossa.
#
# [[rooli]] on ammattiprofiili. Sen polku on tavoitetaitojen ja niiden
# kaikkien esitietojen joukko.

# roadmap.sh-polut, joiden aihelistat on käyty läpi rajauksen tukena.
# roadmap.sh:n sisältö on tekijänoikeudella suojattua (kaikki oikeudet
# pidätetään), joten siitä ei kopioida tekstiä eikä kuvia; viittaukset
# ovat vain polkujen nimiä.
[lahteet]
roadmap_haettu = "2026-11-22"
roadmap_polut = [
  "c", "cpp", "rust", "python", "computer-science",
  "datastructures-and-algorithms", "linux", "shell-bash", "git-github",
  "cyber-security", "network-engineer", "system-design", "game-developer",
  "server-side-game-developer", "devops", "docker", "kubernetes",
  "golang", "java", "kotlin", "javascript", "typescript", "sql",
  "postgresql-dba", "html", "css", "frontend", "react", "backend",
  "spring-boot", "android",
]

# Taitopuukartan (sivusto/) linkit lähdekoodiin ja Codespacesiin.
[sivusto]
repo = "saperant/tutoriaalit"
haara = "main"

