# Esimerkkien tarkistusasetukset (ruff ja mypy lukevat tämän).
[project]
name = "python-tyokalut-esimerkit"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 78

[tool.ruff.lint]
# Pyflakes ja pycodestyle sekä bugbear, pyupgrade ja simplify.
select = ["E", "F", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
