# Python-esimerkkien tarkistusasetukset.
[project]
name = "kuvausstandardit-esimerkit"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 78

[tool.ruff.lint]
# Pyflakes ja pycodestyle (oletus) sekä bugbear, pyupgrade ja simplify.
select = ["E", "F", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

# PeakRDL-ipxact ei julkaise tyyppitietoja (py.typed puuttuu).
[[tool.mypy.overrides]]
module = ["peakrdl_ipxact", "peakrdl_ipxact.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["testit"]
addopts = "-p no:cacheprovider"
