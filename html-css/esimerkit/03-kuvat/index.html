<!doctype html>
<html lang="fi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="testi:leveydet" content="360 1024">
    <title>Retkikohteet – Luontopolut</title>
    <link rel="stylesheet" href="tyyli.css">
  </head>
  <body>
    <header>
      <!-- @alku linkkikuva -->
      <a href="/">
        <img src="logo.svg" alt="Luontopolut – etusivu"
             width="40" height="40">
      </a>
      <!-- @loppu linkkikuva -->
    </header>
    <main>
      <h1>Kolin kansallispuisto</h1>
      <!-- @alku kuva -->
      <img src="maisema-640.svg"
           srcset="maisema-640.svg 640w, maisema-1280.svg 1280w"
           sizes="(min-width: 800px) 720px, 100vw"
           width="640" height="360" data-mitta="maisema"
           alt="Ukko-Kolin laelta näkyy Pielisen selkä ja saaret.">
      <!-- @loppu kuva -->
      <!-- @alku kaavio -->
      <figure>
        <svg role="img" aria-labelledby="kaavio-otsikko"
             width="200" height="60" viewBox="0 0 200 60">
          <title id="kaavio-otsikko">Kävijöitä vuonna 2024 180 000
            ja vuonna 2025 210 000</title>
          <rect x="0" y="10" width="154" height="18" fill="#1d4f91"/>
          <rect x="0" y="34" width="180" height="18" fill="#1d4f91"/>
        </svg>
        <figcaption>Kävijämäärä kasvoi 17 prosenttia.</figcaption>
      </figure>
      <!-- @loppu kaavio -->
      <!-- @alku koriste -->
      <p><img src="logo.svg" alt="" width="16" height="16">
        Merkitty reitti 7 km.</p>
      <!-- @loppu koriste -->
    </main>
  </body>
</html>
