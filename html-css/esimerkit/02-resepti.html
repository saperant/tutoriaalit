<!doctype html>
<html lang="fi">
  <head>
    <meta charset="utf-8">
    <title>Kaurapuuro – Reseptit</title>
  </head>
  <body>
    <main>
      <!-- @alku resepti -->
      <article>
        <h1>Kaurapuuro</h1>
        <p>Julkaistu <time datetime="2026-11-02">2.11.2026</time>.
          Valmistusaika <time datetime="PT10M">10 min</time>.</p>
        <h2>Ainekset</h2>
        <ul>
          <li>2 <abbr title="desilitraa">dl</abbr> kaurahiutaleita</li>
          <li>4 dl vettä</li>
        </ul>
        <h2>Valmistus</h2>
        <ol>
          <li>Kiehauta vesi.</li>
          <li>Lisää hiutaleet ja keitä <strong>sekoittaen</strong>.</li>
        </ol>
        <h2>Ravintoarvot annosta kohden</h2>
        <dl>
          <dt>Energia</dt>
          <dd>270 kcal</dd>
          <dt>Proteiini</dt>
          <dd>9 g</dd>
        </dl>
      </article>
      <!-- @loppu resepti -->
    </main>
  </body>
</html>
