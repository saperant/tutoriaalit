<!doctype html>
<html lang="fi">
  <head>

    <title>Konttikyselyt – Kylälehti</title>
    <link rel="stylesheet" href="kortti.css">
  </head>
  <body>
    <h1>Kylälehti</h1>
    <!-- @alku rakenne -->
    <div class="sivu">
      <main class="kortin-kehys">
        <article class="kortti">
          <img src="kuva.svg" alt="" width="320" height="180"
               data-mitta="pääpalstan kuva">
          <h2>Kirjasto auki sunnuntaisin</h2>
        </article>
      </main>
      <aside class="kortin-kehys" aria-label="Luetuimmat">
        <article class="kortti">
          <img src="kuva.svg" alt="" width="320" height="180"
               data-mitta="sivupalkin kuva">
          <h2>Uimahalli remonttiin</h2>
        </article>
      </aside>
    </div>
    <!-- @loppu rakenne -->
