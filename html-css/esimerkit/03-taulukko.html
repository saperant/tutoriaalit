<!doctype html>
<html lang="fi">
  <head>
    <meta charset="utf-8">
    <title>Sähkön kulutus – Taloyhtiö</title>
    <style>
      /* @alku tyyli */
      table { border-collapse: collapse; }
      th, td { padding: 4px 12px; border-block-end: 1px solid #999; }
      td { text-align: end; font-variant-numeric: tabular-nums; }
      caption { text-align: start; font-weight: bold; }
      /* @loppu tyyli */
    </style>
  </head>
  <body>
    <main>
      <!-- @alku taulukko -->
      <table>
        <caption>Sähkönkulutus neljänneksittäin (kWh)</caption>
        <thead>
          <tr>
            <th scope="col">Rappu</th>
            <th scope="col">Q1</th>
            <th scope="col">Q2</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="row">A</th>
            <td>4 120</td>
            <td>2 380</td>
          </tr>
          <tr>
            <th scope="row">B</th>
            <td>3 960</td>
            <td>2 210</td>
          </tr>
        </tbody>
      </table>
      <!-- @loppu taulukko -->
    </main>
  </body>
</html>
