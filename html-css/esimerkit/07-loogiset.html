<!doctype html>
<html lang="fi">
  <head>
    <meta charset="utf-8">
    <meta name="testi:saavutettavuus" content="ei">
    <title>Loogiset ominaisuudet – Tyyliopas</title>
    <style>
      body { margin: 0; font: 16px/1.5 "DejaVu Sans", sans-serif; }
      /* @alku loogiset */
      .viesti {
        inline-size: 300px;
        padding-inline: 16px;
        border-inline-start: 4px solid #1d4f91;
      }
      .viesti .merkki {
        display: inline-block;
        inline-size: 20px;
        margin-inline-end: 8px;
      }
      /* @loppu loogiset */
    </style>
  </head>
  <body>
    <!-- @alku rakenne -->
    <p class="viesti" data-mitta="ltr-viesti">
      <span class="merkki" data-mitta="ltr-merkki">i</span>Tervetuloa</p>
    <p class="viesti" dir="rtl" lang="ar" data-mitta="rtl-viesti">
      <span class="merkki" data-mitta="rtl-merkki">i</span>مرحبا</p>
    <!-- @loppu rakenne -->
  </body>
</html>
