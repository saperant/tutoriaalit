# Kirjoitusvirhe kentän nimessä: ilman tiukkaa tarkistusta klusteri
# hylkäisi tai ohittaisi kentän, ja palvelussa olisi yksi pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replica: 3
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/esimerkki/kaynnit:1.0.0
