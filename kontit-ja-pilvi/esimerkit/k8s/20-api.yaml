# @alku deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: kaynnit
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: kaynnit
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  # Rullaava päivitys: uusi pod ensin valmiiksi, vasta sitten vanha pois.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: kaynnit
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/esimerkki/kaynnit:1.0.0
          args: ["api.py"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: kaynnit-asetukset
          env:
            - name: API_AVAIN
              valueFrom:
                secretKeyRef:
                  name: kaynnit-salaisuudet
                  key: API_AVAIN
          # @loppu deployment
          # @alku tarkistukset
          readinessProbe:
            httpGet:
              path: /valmius
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /terveys
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
# @loppu tarkistukset
---
# @alku service
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: kaynnit
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 80
      targetPort: http
# @loppu service
