# Huollot (solmun tyhjennys) eivät saa viedä kaikkia api-podeja kerralla.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: kaynnit
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
---
# Vaakaskaalaus: 2–6 podia prosessorikuorman mukaan.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: kaynnit
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
