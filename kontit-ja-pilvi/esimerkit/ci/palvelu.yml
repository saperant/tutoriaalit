# Käyntilaskurin putki GitHub Actionsissa: testit, kuva, käyttöönotto.
# Tiedosto kuuluisi repositoriossa polkuun .github/workflows/.
name: kaynnit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # @alku testit
  testit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Samat testit kuin kehittäjän koneella: kuvan testit-vaihe.
      - run: docker build --target testit sovellus
      - run: >
          pipx run --spec hadolint-bin==2.15.1
          hadolint sovellus/Dockerfile
  # @loppu testit

  # @alku kuva
  kuva:
    needs: testit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: sovellus
          target: ajo
          push: true
          # Tagi on commitin tunniste: jokainen kuva on jäljitettävissä
          # lähdekoodiin, eikä samaa tagia koskaan kirjoiteta yli.
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: VERSIO=${{ github.sha }}
          provenance: true
          sbom: true
  # @loppu kuva

  # @alku kayttoonotto
  kayttoonotto:
    needs: kuva
    runs-on: ubuntu-24.04
    # Ympäristö voi vaatia hyväksynnän ja tarjoaa omat salaisuutensa.
    environment: tuotanto
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Kubeconfig salaisuudesta
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
      - name: Päivitys Helmillä
        run: >
          helm upgrade --install kaynnit helm/kaynnit
          --namespace kaynnit --create-namespace
          -f helm/kaynnit/values-tuotanto.yaml
          --set kuva.tag=${{ github.sha }}
          --wait --timeout 5m --atomic
  # @loppu kayttoonotto
