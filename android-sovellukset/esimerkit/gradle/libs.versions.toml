# Versioluettelo: kaikki riippuvuudet ja niiden versiot yhdessä paikassa.
# @alku versiot
[versions]
agp = "9.5.2"
kotlin = "2.4.21"
ksp = "2.3.14"
compose-bom = "2026.11.01"
activity = "1.13.0"
core = "1.19.1"
lifecycle = "2.11.1"
navigation = "2.10.2"
room = "2.8.5"
datastore = "1.3.0"
work = "2.12.0"
coroutines = "1.11.0"
serialization = "1.13.0"
ktor = "3.6.1"
junit = "4.13.2"
robolectric = "4.18.1"
androidx-test = "1.7.0"
androidx-test-junit = "1.3.0"
androidx-test-runner = "1.7.0"
turbine = "1.2.1"
roborazzi = "1.79.0"
# @loppu versiot

[libraries]
# @alku kirjastot
androidx-core = { module = "androidx.core:core-ktx", version.ref = "core" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
work-testing = { module = "androidx.work:work-testing", version.ref = "work" }
junit = { module = "junit:junit", version.ref = "junit" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
# @loppu kirjastot

[libraries.androidx-activity-compose]
module = "androidx.activity:activity-compose"
version.ref = "activity"

[libraries.compose-bom]
module = "androidx.compose:compose-bom"
version.ref = "compose-bom"

[libraries.compose-ui-tooling-preview]
module = "androidx.compose.ui:ui-tooling-preview"

[libraries.lifecycle-viewmodel-compose]
module = "androidx.lifecycle:lifecycle-viewmodel-compose"
version.ref = "lifecycle"

[libraries.lifecycle-runtime-compose]
module = "androidx.lifecycle:lifecycle-runtime-compose"
version.ref = "lifecycle"

[libraries.navigation-compose]
module = "androidx.navigation:navigation-compose"
version.ref = "navigation"

[libraries.navigation-testing]
module = "androidx.navigation:navigation-testing"
version.ref = "navigation"

[libraries.androidx-test-runner]
module = "androidx.test:runner"
version.ref = "androidx-test-runner"

# @alku taulukko
[libraries.room-compiler]
module = "androidx.room:room-compiler"
version.ref = "room"
# @loppu taulukko

[libraries.datastore-preferences]
module = "androidx.datastore:datastore-preferences"
version.ref = "datastore"

[libraries.work-runtime]
module = "androidx.work:work-runtime-ktx"
version.ref = "work"

[libraries.coroutines-android]
module = "org.jetbrains.kotlinx:kotlinx-coroutines-android"
version.ref = "coroutines"

[libraries.coroutines-test]
module = "org.jetbrains.kotlinx:kotlinx-coroutines-test"
version.ref = "coroutines"

[libraries.serialization-json]
module = "org.jetbrains.kotlinx:kotlinx-serialization-json"
version.ref = "serialization"

[libraries.ktor-client-core]
module = "io.ktor:ktor-client-core"
version.ref = "ktor"

[libraries.ktor-client-okhttp]
module = "io.ktor:ktor-client-okhttp"
version.ref = "ktor"

[libraries.ktor-client-content-negotiation]
module = "io.ktor:ktor-client-content-negotiation"
version.ref = "ktor"

[libraries.ktor-serialization-json]
module = "io.ktor:ktor-serialization-kotlinx-json"
version.ref = "ktor"

[libraries.ktor-client-mock]
module = "io.ktor:ktor-client-mock"
version.ref = "ktor"

[libraries.robolectric]
module = "org.robolectric:robolectric"
version.ref = "robolectric"

[libraries.androidx-test-core]
module = "androidx.test:core-ktx"
version.ref = "androidx-test"

[libraries.androidx-test-junit]
module = "androidx.test.ext:junit-ktx"
version.ref = "androidx-test-junit"

[libraries.roborazzi]
module = "io.github.takahirom.roborazzi:roborazzi"
version.ref = "roborazzi"

[libraries.roborazzi-compose]
module = "io.github.takahirom.roborazzi:roborazzi-compose"
version.ref = "roborazzi"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

[plugins.kotlin-compose]
id = "org.jetbrains.kotlin.plugin.compose"
version.ref = "kotlin"

[plugins.kotlin-serialization]
id = "org.jetbrains.kotlin.plugin.serialization"
version.ref = "kotlin"
