# Yocto-kerroksen kuvaus (Yocto 5.0 Scarthgap).
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"
BBFILE_COLLECTIONS += "tutoriaali"
BBFILE_PATTERN_tutoriaali = "^${LAYERDIR}/"
BBFILE_PRIORITY_tutoriaali = "6"
LAYERDEPENDS_tutoriaali = "core"
LAYERSERIES_COMPAT_tutoriaali = "scarthgap"
